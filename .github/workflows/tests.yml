name: Tests and Streamlit Startup Smoke Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cloud-compatible:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install cloud requirements and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ensure no heavy cloud dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('requirements.txt').read_text().lower()
          for name in ['torch', 'scikit-learn', 'scipy', 'joblib', 'tensorflow']:
              assert name not in '\n'.join(line for line in text.splitlines() if line.strip() and not line.lstrip().startswith('#')), name
          print('Cloud dependencies verified')
          PY
      - name: Unit and portable-model parity tests
        run: python -m pytest -q tests
      - name: Launch Streamlit headless and verify health endpoint
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit-test.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo 'Streamlit health check passed'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit-test.log
          exit 1
